[pytest]
python_files = *-tests.py test_*.py
python_classes = Test*
python_functions = test_*

markers =
    regression: Маркировка для регрессионных тестов.
    registration: Маркировка для тестов, связанных с регистрацией.
    authorization: Маркировка для тестов, связанных с авторизацией пользователя.
    courses: Маркировка для тестов, связанных с курсами.